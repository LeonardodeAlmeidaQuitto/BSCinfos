<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>My Teams</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="teamcss">
</head>
<body>
    <div id="teams-container">
        <h1>Estatísticas dos Times</h1>
        <div id="grid-teams">Carregando dados...</div>
    </div>
    <div class="tabs-container">
        <button class="tab-btn active" onclick="trocarAba(event, 'player')">PLAYER</button>
        <button class="tab-btn" onclick="trocarAba(event, 'coach')">COACH</button>
    </div>

    <div id="content-player" class="tab-content active">
    <div id="grid-teams-player"></div>
    </div>

    <div id="content-coach" class="tab-content">
        <div id="grid-teams-coach"></div>
    </div>
    
    <script src="team.js"></script>
</body>
</html>
