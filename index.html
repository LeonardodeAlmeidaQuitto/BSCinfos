    <main>
        <div id="tela-meta" class="tela-ativa">
            <header class="page-header">
                <h1>SOUTH AMERICA INFOS <span class="accent">ANALYSIS</span></h1>
                <p class="subtitle">Dados extraídos de Scrims e Torneios Oficiais</p>
            </header>
            
            <div class="filter-container">
                <select id="select-ano" class="filter-select" onchange="filtrarEAplicarDados()">
                    <option value="2026">2026</option>
                </select>
                <select id="select-mes" class="filter-select" onchange="filtrarEAplicarDados()">
                    <option value="todos">Todos os Meses</option>
                    <option value="04">Abril</option>
                    <option value="05" selected>Maio</option>
                </select>
            </div>
            
            <div id="grid-modos"></div> 

            <div class="modo-section">
                <button class="modo-header" onclick="toggleElemento(this)">
                    ALL MAPS ANALYSIS <span>▶</span>
                </button>
                <div class="mapa-content" style="display:none">
                    <table class="excel-table">
                        <thead>
                            <tr>
                                <th class="col-img">IMG</th>
                                <th class="col-brawler sortable" onclick="ordenarTabela(this, 'string')" style="text-align: left;">BRAWLER ↕</th>
                                <th class="col-stats sortable" onclick="ordenarTabela(this, 'number')">PICKS ↕</th>
                                <th class="col-stats sortable" onclick="ordenarTabela(this, 'number')">WINS ↕</th>
                                <th class="col-stats sortable" onclick="ordenarTabela(this, 'percent')">WIN RATE ↕</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-all-maps">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tela-brawlers" class="tela-oculta">
            <div class="brawlers-container">
                <div class="brawlers-sidebar" id="lista-brawlers-sidebar">
                    </div>
                <div class="brawler-info-panel">
                    <h2 id="brawler-nome-destaque">Selecione um Brawler</h2>
                    
                    <div class="info-box">
                        <h3>MELHOR MAPA</h3>
                        <p id="brawler-melhor-mapa" class="destaque-mapa">-</p>
                    </div>

                    <div class="info-box">
                        <h3>TOP 5 SINERGIAS (Mais jogados juntos)</h3>
                        <div class="sinergias-grid" id="brawler-sinergias">
                            </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tela-times" class="tela-oculta">
            <div class="times-container">
                <div class="times-sidebar" id="lista-times-sidebar">
                    </div>
                <div class="time-info-panel" id="time-info-painel">
                    <h2>Selecione um Time</h2>
                </div>
            </div>
        </div>
    </main>
