<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Infos - South América Analysis</title> 
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="refresh" content="2400">
    <script src="app.js"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-link">MENU</a>
        <div class="nav-links">
            <a href="sa.html" class="nav-link">SA</a>
            <a href="na.html" class="nav-link">NA</a>
            <a href="emea.html" class="nav-link">EMEA</a>
            <a href="ea.html" class="nav-link">EA</a>
            <a href="geral.html" class="nav-link">GERAL</a>
        </div>
        <div class="nav-right"></div>
    </nav>

    <main>
        <header class="page-header">
            <h1>SOUTH AMÉRICA <span class="accent">ANALYSIS</span></h1>
            <p class="subtitle" style="color: var(--accent-purple); font-weight: bold; margin-top: 10px;">
                Dados extraídos de Scrims, Tournaments e Ladder Competitiva
            </p>
        </header>
        
        <div id="grid-modos"></div> 

        <section class="all-maps-section">
            <header class="all-maps-header">
                <h2>ALL MAPS <span class="accent">ANALYSIS</span></h2>
                <p>Soma total de todos os modos e mapas da região</p>
            </header>

            <div class="all-maps-container">
                <table class="all-maps-table">
                    <thead>
                        <tr>
                            <th class="text-left">BRAWLER</th>
                            <th class="sortable" onclick="ordenarTabela(this, 'number')">PICKS ↕</th>
                            <th class="sortable" onclick="ordenarTabela(this, 'number')">WINS ↕</th>
                            <th class="sortable" onclick="ordenarTabela(this, 'percent')">WIN RATE ↕</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-all-maps">
                        </tbody>
                </table>
            </div>
        </section>
    </main>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Chama a função principal do app.js passando a sigla da região
            // Se este arquivo for o na.html, mude para carregarRegiao('na');
            carregarRegiao('sa');
        });
    </script>
</body>
</html>
