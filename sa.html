<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Infos - South América</title> 
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="refresh" content="2400">
    <script src="app.js"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-link">MENU</a>
        <div class="nav-links">
            <a href="sa.html" class="nav-link">SA</a>
            <a href="na.html" class="nav-link">NA</a>
            <a href="emea.html" class="nav-link">EMEA</a>
            <a href="ea.html" class="nav-link">EA</a>
            <a href="geral.html" class="nav-link">GERAL</a>
        </div>
        <div class="nav-right"></div>
    </nav>

    <main class="grid">
        <header class="page-header">
            <h1>SOUTH AMÉRICA <span class="accent">ANALYSIS</span></h1>
            <p class="subtitle">Dados extraídos de Scrims, Tournaments e Ladder Competitiva</p>
        </header>
        
        <div id="grid-modos"></div> 

        <div class="modo-section">
            <button class="modo-header" onclick="toggleModo('all-maps-collapse')">
                ALL MAPS ANALYSIS
                <span>▶</span>
            </button>

            <div id="all-maps-collapse" class="mapa-content">
                <table class="all-maps-table excel-table">
                    <thead>
                        <tr>
                            <th class="col-img">IMG</th> 
                            <th class="sortable text-left">BRAWLER</th>
                            <th class="sortable">PICKS</th>
                            <th class="sortable">WINS</th>
                            <th class="sortable">WIN RATE</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-all-maps">
                        </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarRegiao('sa');
        });

        // Função padronizada para abrir/fechar e girar a seta
        function toggleModo(id) {
            const content = document.getElementById(id);
            const btn = content.previousElementSibling;
            const seta = btn.querySelector('span');

            if (content.style.display === "block") {
                content.style.display = "none";
                seta.style.transform = "rotate(0deg)";
            } else {
                content.style.display = "block";
                seta.style.transform = "rotate(90deg)";
            }
        }
    </script>
</body>
</html>
