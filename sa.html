<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUTH AMERICA Infos</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-link">MENU</a>
        <div class="nav-links">
            
            <div class="dropdown">
                <a href="#" class="nav-link" id="sa-menu-btn">SA ▼ (META)</a>
                <div class="dropdown-content">
                    <a href="#" onclick="mudarTela('meta'); return false;">Meta</a>
                    <a href="#" onclick="mudarTela('brawlers'); return false;">Brawlers</a>
                    <a href="#" onclick="mudarTela('times'); return false;">Times</a>
                    <a href="#" onclick="mudarTela('players'); return false;">Players</a>
                </div>
            </div>

            <div class="dropdown">
                <a href="#" class="nav-link">OUTROS ▼</a>
                <div class="dropdown-content">
                    <a href="na.html" style="display: flex; align-items: center; gap: 8px;">
                        <img src="element/na.png" style="width: 20px; height: 20px; border-radius: 50%;" onerror="this.style.display='none'"> North America
                    </a>
                    <a href="emea.html" style="display: flex; align-items: center; gap: 8px;">
                        <img src="element/emea.png" style="width: 20px; height: 20px; border-radius: 50%;" onerror="this.style.display='none'"> EMEA
                    </a>
                    <a href="apac.html" style="display: flex; align-items: center; gap: 8px;">
                        <img src="element/apac.png" style="width: 20px; height: 20px; border-radius: 50%;" onerror="this.style.display='none'"> APAC
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="conteudo-principal">
        
        <div id="tela-meta" class="tela-secao tela-ativa">
            <h2 class="titulo-secao">Análise do Meta Geral (SA)</h2>
            <div class="tabela-responsiva">
                <table class="tabela-dados">
                    <thead>
                        <tr>
                            <th>Posição</th>
                            <th>Brawler</th>
                            <th>Partidas Jogadas</th>
                            <th>Vitórias</th>
                            <th>Win Rate</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-meta-corpo">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="tela-brawlers" class="tela-secao tela-oculta">
            <h2 class="titulo-secao">Estatísticas Detalhadas de Brawlers</h2>
            <div class="brawlers-grid" id="grid-brawlers">
                </div>
        </div>

        <div id="tela-times" class="tela-secao tela-oculta">
            <h2 class="titulo-secao">Power Rankings & Roster de Times</h2>
            <div id="container-times">
                </div>
        </div>

        <div id="tela-players" class="tela-secao tela-oculta">
            <h2 class="titulo-secao">Estatísticas Individuais dos Jogadores</h2>
            <div class="players-grid" id="grid-players">
                </div>
        </div>

    </main>

    <div id="brawler-modal" class="brawler-modal-overlay" onclick="fecharModal(event)">
        <div class="brawler-modal-card">
            <div class="brawler-modal-header">
                <h3 id="modal-brawler-nome">Nome do Brawler</h3>
                <button class="btn-fechar" onclick="document.getElementById('brawler-modal').style.display='none'">&times;</button>
            </div>
            <div class="brawler-modal-body" id="modal-brawler-conteudo">
                </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof carregarRegiao === 'function') {
                carregarRegiao('sa');
            }

            window.mudarTela = function(tela) {
                document.querySelectorAll('.tela-secao').forEach(sec => {
                    sec.classList.remove('tela-ativa');
                    sec.classList.add('tela-oculta');
                });
                
                const telaAlvo = document.getElementById(`tela-${tela}`);
                if (telaAlvo) {
                    telaAlvo.classList.remove('tela-oculta');
                    telaAlvo.classList.add('tela-ativa');
                }

                const titulos = {
                    'meta': 'SA ▼ (META)', 
                    'brawlers': 'SA ▼ (BRAWLERS)', 
                    'times': 'SA ▼ (TIMES)',
                    'players': 'SA ▼ (PLAYERS)'
                };
                
                const btn = document.getElementById('sa-menu-btn');
                if (btn && titulos[tela]) {
                    btn.textContent = titulos[tela];
                }

                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
            };
        });

        function fecharModal(e) {
            if (e.target.id === 'brawler-modal') {
                document.getElementById('brawler-modal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
