<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUTH AMERICA Infos</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html" class="nav-link">MENU</a>
            <div class="nav-links">
                <div class="dropdown">
                    <a href="#" class="nav-link">SA ▼</a>
                    <div class="dropdown-content">
                    <a href="#" onclick="mostrarTela('meta')">META</a>
                    <a href="#" onclick="mostrarTela('brawlers')">BRAWLERS</a>
                    <a href="#" onclick="mostrarTela('times')">TIMES - PLAYERS</a>
                </div>
            </div>
            <a href="na.html" class="nav-link">NA</a>
            <a href="emea.html" class="nav-link">EMEA</a>
            <a href="ea.html" class="nav-link">EA</a>
            <a href="geral.html" class="nav-link">GERAL</a>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1>SOUTH AMERICA INFOS <span class="accent">ANALYSIS</span></h1>
            <p class="subtitle">Dados extraídos de Scrims e Torneios Oficiais</p>
        </header>
        
        <!-- FILTROS CENTRALIZADOS -->
        <div class="filter-container">
            <select id="select-ano" class="filter-select" onchange="filtrarEAplicarDados()">
                <option value="TODOS">ANO: TODOS</option>
            </select>
            <select id="select-mes" class="filter-select" onchange="filtrarEAplicarDados()">
                <option value="TODOS">MÊS: TODOS</option>
            </select>
        </div>
        
        <div id="tela-meta">

        <div id="grid-modos"></div>

        <!-- SEÇÃO DE ANÁLISE -->
        <div class="modo-section">
            <button class="modo-header" onclick="toggleElemento(this)">
                ALL MAPS ANALYSIS <span>▶</span>
            </button>
            <div class="mapa-content" style="display:none">
                <table class="excel-table">
                    <thead>
                        <tr>
                            <th class="col-img">IMG</th>
                            <th class="col-brawler sortable" onclick="ordenarTabela(this, 'string')" style="text-align: left;">BRAWLER ↕</th>
                            <th class="col-stats sortable" onclick="ordenarTabela(this, 'number')">PICKS ↕</th>
                            <th class="col-stats sortable" onclick="ordenarTabela(this, 'number')">WINS ↕</th>
                            <th class="col-stats sortable" onclick="ordenarTabela(this, 'percent')">WIN RATE ↕</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-all-maps">
                        <!-- Os dados são preenchidos dinamicamente pelo app.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="tela-brawlers" style="display:none">
        <div class="brawlers-layout">
        <div id="lista-brawlers">
            </div>
        <div id="info-brawler">
           <h2>Selecione um Brawler</h2>
            </div>
        </div>
        </div>
    <div id="tela-times" style="display:none">
    <div id="lista-times">
    </div>
    </div>

    <script>
        // Inicia o carregamento dos dados específicos da região SA
        document.addEventListener('DOMContentLoaded', () => carregarRegiao('sa'));
    </script>
</body>
</html>
