<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL Infos</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>window.REGIAO_ATUAL = "GERAL";</script>
    
    <script src="app.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-link">MENU</a>
        <div class="nav-links">
        <div class="dropdown">
            <a href="#" class="nav-link" id="ea-menu-btn">ALL ▼ (META)</a>
            <div class="dropdown-content">
                <a href="#" onclick="mudarTela('meta'); return false;">Meta</a>
                <a href="#" onclick="mudarTela('brawlers'); return false;">Brawlers</a>
                <a href="#" onclick="mudarTela('times'); return false;">Times</a>
                <a href="#" onclick="mudarTela('scrims'); return false;">Scrims</a>
            </div>
        </div>
        </div>
        <a href="geral.html" class="nav-link">GERAL</a>
        <div class="dropdown">
                <a href="#" class="nav-link">OUTROS ▼</a>
                <div class="dropdown-content">
                    <a href="sa.html" style="display: flex; align-items: center; gap: 8px;">
                        <img src="element/sa.png" style="width: 20px; height: 20px; object-fit: contain; border-radius: 2px;" onerror="this.style.display='none'"> 
                        SA
                    </a>
                    <a href="emea.html" style="display: flex; align-items: center; gap: 8px;">
                        <img src="element/emea.png" style="width: 20px; height: 20px; object-fit: contain; border-radius: 2px;" onerror="this.style.display='none'"> 
                        EMEA
                    </a>
                    <a href="ea.html" style="display: flex; align-items: center; gap: 8px;">
                        <img src="element/na.png" style="width: 20px; height: 20px; object-fit: contain; border-radius: 2px;" onerror="this.style.display='none'"> 
                        NA
                    </a>
                    <a href="ea.html" style="display: flex; align-items: center; gap: 8px;">
                        <img src="element/ea.png" style="width: 20px; height: 20px; object-fit: contain; border-radius: 2px;" onerror="this.style.display='none'"> 
                        EA
                    </a>
                </div>
            </div>

    </nav>

    <main class="main-container">
        <header class="page-header">
            <h1>EUROPEAN INFOS <span class="accent">ANALYSIS</span></h1>
        </header>

        <!-- Filtros Globais (Dia adicionado entre Mês e Tipo) -->
        <div class="filter-container">
            <select id="select-ano" class="filter-select" onchange="processarDadosGlobais()"></select>
            <select id="select-mes" class="filter-select" onchange="processarDadosGlobais()"></select>
            <select id="select-dia" class="filter-select" onchange="processarDadosGlobais()"></select>
            <select id="select-tipo" class="filter-select" onchange="processarDadosGlobais()">
                <option value="todos">Overhaul (Todos)</option>
                <option value="scrim">Scrim</option>
                <option value="tournament">Tournament</option>
            </select>
        </div>

        <!-- Tela META -->
        <div id="tela-meta" class="tela-secao tela-ativa">
            <div id="conteudo-meta"></div> 
        </div>

        <!-- Tela BRAWLERS -->
        <div id="tela-brawlers" class="tela-secao tela-oculta">
            <div class="brawlers-container">
                <div class="sidebar">
                    <input type="text" id="search-brawler-sidebar" class="sidebar-search" placeholder="Buscar Brawler..." oninput="filtrarBrawlersSidebar()">
                    <div class="sidebar-list" id="lista-brawlers-sidebar"></div>
                </div>
                <div class="info-panel" id="painel-info-brawler">
                    <div class="placeholder-text" style="color:var(--texto-secundario); text-align:center;">Selecione um brawler na lateral para ver sinergias e matchups.</div>
                </div>
            </div>
        </div>

        <!-- Tela TIMES -->
        <div id="tela-times" class="tela-secao tela-oculta">
            <div class="times-container">
                <div class="sidebar">
                    <div class="sidebar-header">EQUIPES DE ALL REGIONS</div>
                    <div class="sidebar-list" id="lista-times-sidebar"></div>
                </div>
                <div class="info-panel" id="painel-info-time">
                    <div class="placeholder-text" style="color:var(--texto-secundario); text-align:center;">Selecione um time na lateral para ver os dados de seus players.</div>
                </div>
            </div>
        </div>

        <!-- Tela SCRIMS -->
        <div id="tela-scrims" class="tela-secao tela-oculta">
            <div id="scrims-lista" class="scrins-grid"></div>
            <div id="scrims-detalhe" style="display:none;"></div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.mudarTela = function(tela) {
                document.querySelectorAll('.tela-secao').forEach(sec => sec.classList.replace('tela-ativa', 'tela-oculta'));
                document.getElementById(`tela-${tela}`).classList.replace('tela-oculta', 'tela-ativa');
                
                const titulos = {'meta': 'ALL ▼ (META)', 'brawlers': 'ALL ▼ (BRAWLERS)', 'times': 'ALL ▼ (TIMES)', 'scrims': 'ALL ▼ (SCRIMS)'};
                document.getElementById('all-menu-btn').textContent = titulos[tela];
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
            };
        });
    </script>
</body>
</html>
