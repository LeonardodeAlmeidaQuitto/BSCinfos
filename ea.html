<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>EA Infos</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-link">MENU</a>
        <div class="nav-links">
            <a href="sa.html" class="nav-link">SA</a>
            <a href="na.html" class="nav-link">NA</a>
            <a href="emea.html" class="nav-link">EMEA</a>
            <a href="ea.html" class="nav-link">EA</a>
            <a href="geral.html" class="nav-link">GERAL</a>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1>EA INFOS <span class="accent">ANALYSIS</span></h1>
            <p class="subtitle">Dados extraídos de Scrims e Torneios Oficiais</p>
        </header>
        
        <div class="filter-container">
            <select id="select-ano" class="filter-select" onchange="filtrarEAplicarDados()">
                <option value="TODOS">ANO: TODOS</option>
            </select>
            <select id="select-mes" class="filter-select" onchange="filtrarEAplicarDados()">
                <option value="TODOS">MÊS: TODOS</option>
            </select>
        </div>
        
        <div id="grid-modos"></div> 

        <div class="modo-section">
            <button class="modo-header" onclick="toggleElemento(this)">
                ALL MAPS ANALYSIS <span>▶</span>
            </button>
            <div class="mapa-content" style="display:none">
                <table class="excel-table">
                    <thead>
                        <tr>
                            <th class="col-img">IMG</th>
                            <th class="col-brawler sortable" onclick="ordenarTabela(this, 'string')" style="text-align: left;">BRAWLER ↕</th>
                            <th class="col-stats sortable" onclick="ordenarTabela(this, 'number')">PICKS ↕</th>
                            <th class="col-stats sortable" onclick="ordenarTabela(this, 'number')">WINS ↕</th>
                            <th class="col-stats sortable" onclick="ordenarTabela(this, 'percent')">WIN RATE ↕</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-all-maps"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script>document.addEventListener('DOMContentLoaded', () => carregarRegiao('ea'));</script>
</body>
</html>
