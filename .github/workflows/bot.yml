name: Bot Minerador do Brawl Stars

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Sao_Paulo'
    permissions:
      contents: write

    steps:
      - name: Baixando os arquivos do repositório
        uses: actions/checkout@v4
        with:
          lfs: false # NÃO usar LFS — GitHub Pages não resolve arquivos LFS
          fetch-depth: 0 # Baixa o histórico completo para evitar erros de sincronização

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalando as bibliotecas
        run: |
          pip install pandas brawlstats requests

      - name: Configurar Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Remover CSV do Git LFS (CRÍTICO!)
        # Remove o rastreamento LFS dos CSVs para que o GitHub Pages possa servi-los
        run: |
          # Remove a regra de LFS para CSV do .gitattributes
          if [ -f .gitattributes ]; then
            sed -i '/\*\.csv/d' .gitattributes
            echo "Arquivo .gitattributes atualizado (removida regra LFS para CSV)"
            cat .gitattributes
          fi
          # Remove o CSV do cache do LFS e readiciona como arquivo normal
          git rm --cached historico_bruto.csv 2>/dev/null || true
          git rm --cached estatisticas_finais.csv 2>/dev/null || true

      - name: Rodando o Gerador (Bot)
        run: python gerador.py

      - name: Salvando as alterações no GitHub
        run: |
          # Adiciona o .gitattributes (sem a regra LFS para CSV) e os CSVs como arquivos normais
          git add .gitattributes historico_bruto.csv estatisticas_finais.csv || true
          
          # Se a pasta api existir, adiciona também
          git add api/ || true
          
          # Verifica se há mudanças e faz o commit
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Atualização Automática de Partidas"
            
            # Puxa atualizações APÓS fazer o commit (evita o erro 128)
            git pull --rebase origin main || true
            
            # Envia para o GitHub
            git push origin main
          else
            echo "Sem mudanças para atualizar"
          fi
