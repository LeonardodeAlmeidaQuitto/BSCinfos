name: Bot Minerador do Brawl Stars

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Sao_Paulo'
    permissions:
      contents: write

    steps:
      - name: Baixando os arquivos do repositório
        uses: actions/checkout@v4
        with:
          lfs: true # Essencial para ler o arquivo grande

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalando as bibliotecas
        run: |
          pip install pandas brawlstats requests

      - name: Sincronizar, Configurar Git e LFS
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Garante que o Git LFS está ativo na máquina virtual
          git lfs install
          
          # "Esconde" as alterações automáticas do LFS temporariamente
          git stash || true
          
          # Agora o pull vai funcionar sem travar
          git pull --rebase origin main
          
          # Devolve as alterações do LFS para o ambiente, ignorando erros se estiver vazio
          git stash pop || true

      - name: Rodando o Gerador (Bot)
        # ATENÇÃO: Se o nome do seu arquivo Python for diferente, mude aqui.
        run: python gerador.py

      - name: Salvando as alterações no GitHub
        run: |
          # Adiciona o arquivo de configuração do LFS e os dados
          git add .gitattributes historico_bruto.csv estatisticas_finais.csv
          
          # Se a pasta api existir, adiciona também (ignora erro se não existir)
          git add api/ || true
          
          # Verifica se há mudanças e faz o commit usando LFS
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Atualização Automática de Partidas (com LFS)"
            git push origin main
          else
            echo "Sem mudanças para atualizar"
          fi
