name: Bot Minerador do Brawl Stars

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Sao_Paulo'
    permissions:
      contents: write

    steps:
      - name: Baixando os arquivos do repositório
        uses: actions/checkout@v4
        with:
          lfs: true # Essencial para ler o arquivo grande
          fetch-depth: 0 # Baixa o histórico completo para evitar erros de sincronização

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalando as bibliotecas
        run: |
          pip install pandas brawlstats requests

      - name: Configurar Git
        # Apenas configura o nome do bot, sem tentar puxar arquivos desnecessariamente aqui
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Rodando o Gerador (Bot)
        # ATENÇÃO: Se o nome do seu arquivo Python for diferente, mude aqui.
        run: python gerador.py

      - name: Salvando as alterações no GitHub
        run: |
          # Adiciona o arquivo de configuração do LFS e os dados, ignorando erros se algum não existir
          git add .gitattributes historico_bruto.csv estatisticas_finais.csv || true
          
          # Se a pasta api existir, adiciona também
          git add api/ || true
          
          # Verifica se há mudanças e faz o commit
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Atualização Automática de Partidas"
            
            # Puxa atualizações APÓS fazer o commit (evita o erro 128)
            git pull --rebase origin main || true
            
            # Envia para o GitHub
            git push origin main
          else
            echo "Sem mudanças para atualizar"
          fi
