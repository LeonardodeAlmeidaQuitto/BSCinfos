name: Bot Minerador do Brawl Stars

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest

    env:
      TZ: America/Sao_Paulo
      BRAWL_API_KEY: ${{ secrets.BRAWL_API_KEY }}

    permissions:
      contents: write

    steps:
      - name: Baixando o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Configurando Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Atualizando o repositório antes da leitura
        run: |
          git pull --rebase origin main

      - name: Rodando o Gerador e atualizando os Rosters
        run: |
          python gerador.py

      - name: Verificando arquivos gerados
        run: |
          echo '--- rosters.js ---'
          if [ -f rosters.js ]; then
            echo 'rosters.js encontrado.'
            wc -c rosters.js
          else
            echo 'ERRO: gerador.py não criou rosters.js'
            exit 1
          fi

      - name: Salvando as alterações no GitHub
        run: |
          git add -A historico_bruto.csv bans_matcherino.csv rosters.js api/ 2>/dev/null || true
          if [ -f estatisticas_finais.csv ]; then git add estatisticas_finais.csv; fi

          if git diff --cached --quiet; then
            echo 'Sem alterações para enviar.'
          else
            git commit -m '🤖 Atualização automática de partidas e rosters'
            git push origin main
          fi
