- name: Salvando as alterações no GitHub
        run: |
          # Adiciona o .gitattributes (sem a regra LFS para CSV) e os CSVs como arquivos normais
          git add .gitattributes historico_bruto.csv estatisticas_finais.csv || true
          
          # Se a pasta api existir, adiciona também
          git add api/ || true
          
          # Verifica se há mudanças e faz o commit
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Atualização Automática de Partidas"
            
            # Configura o pull para merge padrão e diz ao Git para preferir as alterações locais (do bot) em caso de conflito
            git config pull.rebase false
            git pull origin main -X ours --no-edit || true
            
            # Caso o conflito persista por causa do 'modify/delete', forçamos a adição novamente
            git add historico_bruto.csv estatisticas_finais.csv || true
            git commit -m "🤖 Resolvendo conflito de arquivos" || true
            
            # Envia para o GitHub
            git push origin main
          else
            echo "Sem mudanças para atualizar"
          fi
