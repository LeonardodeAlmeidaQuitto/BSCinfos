name: Bot Minerador do Brawl Stars

on:
  schedule:
    # Roda a cada 30 minutos exatos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Sao_Paulo' # Garante que a máquina use o horário de Brasília
    permissions:
      contents: write

    steps:
      - name: Baixando os arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalando as bibliotecas
        run: |
          pip install pandas brawlstats

      - name: Sincronizar e Configurar Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Puxa as mudanças ANTES de gerar novos dados para evitar conflitos
          git pull --rebase origin main

      - name: Rodando o Gerador (Bot)
        env:
          BRAWL_API_KEY: ${{ secrets.BRAWL_API_KEY }}
        run: python gerador.py

      - name: Salvando as alterações no GitHub
        run: |
          # Adiciona os arquivos atualizados
          git add historico_bruto.csv estatisticas_finais.csv api/
          
          # Só faz o commit e push se o Python realmente encontrou partidas novas
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Atualização Automática de Partidas"
            git push origin main
          else
            echo "Sem mudanças para atualizar"
          fi
