name: Bot Minerador do Brawl Stars

on:
  schedule:
    # Roda a cada 40 minutos exatos
    - cron: '*/40 * * * *'
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixando os arquivos do repositório
        uses: actions/checkout@v4 # Atualizado para v4

      - name: Instalando o Python
        uses: actions/setup-python@v5 # Atualizado para v5
        with:
          python-version: '3.10'

      - name: Instalando as bibliotecas
        run: |
          pip install pandas brawlstats

      - name: Rodando o Gerador (Bot)
        run: python gerador.py

      - name: Salvando as alterações no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Adiciona arquivos e verifica se houve mudanças
          git add historico_bruto.csv estatisticas_finais.csv api/
          
          # Se houver mudanças, faz o commit, sincroniza (pull) e envia (push)
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Atualização Automática de Partidas"
            git pull --rebase origin main
            git push
          else
            echo "Sem mudanças para atualizar"
          fi
