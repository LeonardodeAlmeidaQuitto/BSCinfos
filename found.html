<form id="found-form" class="found-search">

<div class="found-input-row"><input id="player-tag" type="text" autocomplete="off" spellcheck="false" placeholder="#ABC123" maxlength="20" required><button id="found-button" type="submit">PROCURAR</button></div>
<div id="found-status" class="found-status" aria-live="polite"></div>

<section class="found-results-section"><div class="found-results-title"><h2>JOGADORES ENCONTRADOS</h2><button id="clear-found" class="clear-button" type="button">LIMPAR TODOS</button></div>
